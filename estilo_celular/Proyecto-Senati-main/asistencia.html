<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistencia</title>
    <link rel="icon" href="assets/icons/senati.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
      }

      /* ===== FONDO: cubre toda la pantalla del celular ===== */
      body {
        display: flex;
        justify-content: center;
        overflow: hidden;
        font-family: "Poppins", "Montserrat", Arial, sans-serif;

        /* Si tienes la imagen de fondo de tu diseño, descomenta esta línea
           y borra el bloque "background" de abajo:
        background: url("assets/images/fondo_movil.png") center / cover no-repeat;
        */
        background:
          linear-gradient(115deg, transparent 20%, rgba(120, 170, 255, .40) 20.3%, transparent 20.8%),
          linear-gradient(115deg, transparent 26%, rgba(255, 255, 255, .08) 26%, rgba(255, 255, 255, .08) 38%, transparent 38%),
          linear-gradient(115deg, transparent 58%, rgba(90, 150, 255, .35) 58.3%, transparent 58.8%),
          linear-gradient(115deg, transparent 64%, rgba(255, 255, 255, .08) 64%, rgba(255, 255, 255, .08) 74%, transparent 74%),
          linear-gradient(170deg, #0b3fd0 0%, #0a2a9e 45%, #04145a 100%);
        background-attachment: fixed;
      }

      /* ===== CONTENEDOR (ancho de celular, máx. 430 px) ===== */
      .profile-movil {
        width: 100%;
        max-width: 430px;
        height: 100vh;
        height: 100dvh;                /* altura real en celulares */
        container-type: inline-size;   /* permite usar cqw */
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 7cqw;
        overflow-y: auto;
      }

      /* ===== 1. Logo ===== */
      .logo-box {
        flex: 0 0 auto;
        width: 34cqw;
        height: 15.9cqw;
        background: #1b2a85;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .logo-senati {
        max-width: 90%;
        max-height: 85%;
        object-fit: contain;
      }

      /* ===== 2. Avatar ===== */
      .avatar-box {
        flex: 0 0 auto;
        width: 28.2cqw;
        aspect-ratio: 1 / 1;
        margin-top: 2.2cqw;
        background: #fff;
        overflow: hidden;
      }

      .avatar-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* ===== 3. Nombre ===== */
      .user-name {
        flex: 0 0 auto;
        margin-top: 5.4cqw;
        text-align: center;
        color: #c9d3f5;
        font-size: 11px;               /* respaldo */
        font-size: max(11px, 2.8cqw);
        font-weight: 600;
        line-height: 1.7;
        letter-spacing: .3px;
      }

      /* ===== 4. Cámara ===== */
      .camera-frame {
        position: relative;
        flex: 0 0 auto;
        width: 62.5cqw;
        aspect-ratio: 173 / 155;
        margin-top: 12cqw;
        margin-bottom: 8cqw;
        background: #000;
        border: 7px solid #fff;        /* respaldo */
        border-width: 2.5cqw;
        border-radius: 20px;           /* respaldo */
        border-radius: 5cqw;
        overflow: hidden;
      }

      .camera-feed {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .corner {
        position: absolute;
        width: 12.5%;
        aspect-ratio: 1 / 1;
        border: 0 solid #fff;
      }

      .top-left     { top: 9%;    left: 7%;  border-top-width: 2px;    border-left-width: 2px; }
      .top-right    { top: 9%;    right: 7%; border-top-width: 2px;    border-right-width: 2px; }
      .bottom-left  { bottom: 9%; left: 7%;  border-bottom-width: 2px; border-left-width: 2px; }
      .bottom-right { bottom: 9%; right: 7%; border-bottom-width: 2px; border-right-width: 2px; }
    </style>
</head>
<body>
    <main class="profile-movil">

        <!-- 1. Logo superior -->
        <div class="logo-box">
            <img src="assets/images/imagen-bcp (1).webp" alt="Logo" class="logo-senati" />
        </div>

        <!-- 2. Avatar de usuario -->
        <div class="avatar-box">
            <img src="assets/images/persona.png" alt="Avatar de usuario" class="avatar-img" />
        </div>

        <!-- 3. Nombre del usuario -->
        <h2 class="user-name">JHONATAN EDIMAR<br>CELESTINO DE BRITO</h2>

        <!-- 4. Cámara / reconocimiento facial -->
        <div class="camera-frame">
            <!-- Tu foto o elemento <video> de la cámara -->
            <img src="assets/images/camara.gif"Captura facial" class="camera-feed" />

            <!-- 4 esquinas de enfoque facial -->
            <span class="corner top-left"></span>
            <span class="corner top-right"></span>
            <span class="corner bottom-left"></span>
            <span class="corner bottom-right"></span>
        </div>

    </main>
</body>
</html>
