
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión</title>

    <link rel="icon" href="assets/icons/senati.ico" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            background: #f0f3f8;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-page {
            display: grid;
            grid-template-columns: 1fr 1fr;
            width: 100%;
            max-width: 1000px;
            min-height: 570px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.12);
        }

        .promo {
            background: linear-gradient(145deg, #073b73, #0874b9);
            color: white;
            padding: 45px 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .promo-text {
            margin-bottom: 30px;
        }

        .promo-lead {
            font-size: 17px;
            margin-bottom: 8px;
        }

        .promo-badge {
            font-size: 23px;
            font-weight: 600;
        }

        .promo-figure {
            width: 100%;
            margin-bottom: 30px;
        }

        .promo-figure img {
            display: block;
            width: 100%;
            max-width: 330px;
            max-height: 220px;
            object-fit: contain;
            margin: auto;
        }

        .promo-logo {
            width: 130px;
            max-height: 70px;
            object-fit: contain;
            background: white;
            border-radius: 8px;
            padding: 8px;
        }

        .auth {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 45px 35px;
        }

        .login-form {
            width: 100%;
            max-width: 360px;
        }

        .login-title {
            color: #17365d;
            font-size: 32px;
            margin-bottom: 12px;
        }

        .login-description {
            color: #68778b;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .field {
            margin-bottom: 20px;
        }

        .field label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #28374d;
            margin-bottom: 8px;
        }

        .field input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #ccd5e0;
            border-radius: 9px;
            outline: none;
            font-family: inherit;
            font-size: 14px;
            background: #fbfcfe;
        }

        .field input:focus {
            border-color: #0874b9;
            box-shadow: 0 0 0 3px rgba(8, 116, 185, 0.12);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #0874b9;
            color: white;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background: #075b91;
        }

        .demo-notice {
            margin-top: 18px;
            font-size: 12px;
            line-height: 1.6;
            color: #68778b;
            text-align: center;
        }

        @media (max-width: 700px) {
            body {
                padding: 12px;
            }

            .login-page {
                grid-template-columns: 1fr;
                max-width: 430px;
            }

            .promo {
                padding: 28px 20px;
            }

            .promo-text {
                margin-bottom: 15px;
            }

            .promo-lead {
                font-size: 14px;
            }

            .promo-badge {
                font-size: 20px;
            }

            .promo-figure {
                margin-bottom: 15px;
            }

            .promo-figure img {
                max-height: 130px;
            }

            .promo-logo {
                width: 100px;
            }

            .auth {
                padding: 32px 24px;
            }

            .login-title {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>
    <main class="login-page">

        <section class="promo" aria-label="Validación de identidad">
            <div class="promo-text">
                <p class="promo-lead">
                    Valida tu identidad con la opción
                </p>
                <p class="promo-badge">
                    “Reconocimiento Facial”
                </p>
            </div>

            <figure class="promo-figure">
                <img
                    src="assets/images/images 5 (1).png"
                    alt="Ilustración de reconocimiento facial"
                    onerror="this.style.display='none'">
            </figure>

            <img
                src="assets/images/images_1.png"
                alt="Logo BCP"
                class="promo-logo"
                onerror="this.style.display='none'">
        </section>

        <section class="auth" aria-labelledby="login-title">
            <form class="login-form" id="loginForm">
                <h1 class="login-title" id="login-title">
                    Iniciar sesión
                </h1>

                <p class="login-description">
                    Ingresa tus datos para continuar.
                </p>

                <div class="field">
                    <label for="email">Correo electrónico</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="ejemplo@gmail.com"
                        autocomplete="username"
                        required>
                </div>

                <div class="field">
                    <label for="password">Contraseña</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Ingresa tu contraseña"
                        autocomplete="current-password"
                        required>
                </div>

                <button type="submit" class="btn-submit">
                    INGRESAR
                </button>

                <p class="demo-notice">
                    Proyecto académico de demostración.
                    No ingreses contraseñas reales ni datos bancarios.
                </p>
            </form>
        </section>

    </main>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const correo = document.getElementById("email").value.trim();
            const contrasena = document.getElementById("password").value;

            if (!correo || !contrasena) {
                alert("Completa los campos para continuar.");
                return;
            }

            alert("Formulario de demostración. No se enviaron datos.");
        });
    </script>
</body>
</html>
