<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes Empleados</title>
    <link rel="icon" href="assets/icons/senati.ico" type="image/x-icon">

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* ===== FONDO: cubre toda la pantalla ===== */
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: "Poppins", "Montserrat", Arial, sans-serif;

        /* Si tienes la imagen de fondo de tu diseño, descomenta esta línea
           y borra el bloque "background" de abajo:
        background: url("assets/images/fondo_reportes.png") center / cover no-repeat;
        */
        background:
          linear-gradient(135deg, transparent 20%, rgba(120, 180, 255, .40) 20.3%, transparent 20.8%),
          linear-gradient(135deg, transparent 28%, rgba(255, 255, 255, .10) 28%, rgba(255, 255, 255, .10) 38%, transparent 38%),
          linear-gradient(135deg, transparent 52%, rgba(90, 150, 255, .35) 52.3%, transparent 52.8%),
          linear-gradient(135deg, transparent 62%, rgba(255, 255, 255, .10) 62%, rgba(255, 255, 255, .10) 72%, transparent 72%),
          linear-gradient(160deg, #1b2fb8 0%, #1536a8 45%, #0a1a6e 100%);
        background-attachment: fixed;
      }

      /* ===== CONTENEDOR (tablet: 834 px de ancho) ===== */
      .reportes-container {
        position: relative;
        width: min(100vw, calc(100vh * 834 / 515));
        max-width: 834px;
        aspect-ratio: 834 / 515;
        container-type: inline-size;
      }

      /* ===== BARRA SUPERIOR ===== */
      .navbar {
        position: absolute;
        top: 2.3%;
        left: 0;
        width: 100%;
        height: 10%;
        background: rgba(15, 35, 120, .92);
        display: flex;
        align-items: center;
      }

      .nav-logo {
        position: absolute;
        left: 3%;
        width: 11%;
        height: 100%;
        display: flex;
        align-items: center;
      }

      .nav-logo img {
        max-width: 100%;
        max-height: 60%;
        object-fit: contain;
      }

      .nav-links {
        position: absolute;
        left: 52%;
        display: flex;
        gap: 6cqw;
      }

      .nav-links a {
        color: #fff;
        text-decoration: none;
        font-size: 12px;
        font-size: 1.7cqw;
        white-space: nowrap;
      }

      .nav-links a:hover {
        color: #9bc0ff;
      }

      .nav-salir {
        position: absolute;
        right: 3%;
        width: 4.6cqw;
        height: 4.6cqw;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .nav-salir svg {
        width: 100%;
        height: 100%;
      }

      /* ===== TARJETA ===== */
      .reportes-card {
        position: absolute;
        top: 15.8%;
        left: 7.8%;
        width: 88.4%;
        height: 80%;
        border-radius: 28px;
        border-radius: 3.3cqw;
        background: rgba(190, 200, 235, .55);
        backdrop-filter: blur(3px);
        -webkit-backdrop-filter: blur(3px);
        box-shadow: 0 10px 30px rgba(0, 0, 30, .25);
      }

      /* ===== TABLA (con scroll si hay muchos registros) ===== */
      .table-wrap {
        position: absolute;
        top: 10%;
        left: 8.3%;
        width: 83.6%;
        max-height: 85%;
        overflow-y: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }

      th {
        position: sticky;
        top: 0;
        background: #2f3fa8;
        color: #fff;
        font-weight: 400;
        font-size: 11px;
        font-size: 1.7cqw;
        height: 3.8cqw;
        border: 1px solid #1a2575;
      }

      td {
        background: #e8e8f2;
        height: 2.9cqw;
        border: 1px solid #111;
        font-size: 10px;
        font-size: 1.5cqw;
        text-align: center;
        color: #222;
      }

      th:nth-child(1) { width: 29.6%; }
      th:nth-child(2) { width: 41.5%; }
      th:nth-child(3) { width: 28.9%; }
    </style>
</head>
<body>
    <main class="reportes-container">

        <!-- BARRA SUPERIOR -->
        <header class="navbar">
            <div class="nav-logo">
                <!-- Pon aquí tu logo -->
                <img src="assets/images/imagen-bcp.webp" alt="Logo" />
            </div>

            <nav class="nav-links">
                <a href="#">Inicio</a>
                <a href="#">Reportes Empleados</a>
            </nav>

            <a href="#" class="nav-salir" title="Salir">
                <!-- width/height de respaldo: nunca sale gigante -->
                <svg viewBox="0 0 40 40" width="40" height="40" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 6H6v28h10" stroke="#3b4fc4" stroke-width="4"/>
                    <path d="M16 20h20M29 12l8 8-8 8" stroke="#e8264f" stroke-width="4"/>
                </svg>
            </a>
        </header>

        <!-- TARJETA CON LA TABLA -->
        <section class="reportes-card">
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Colaborador</th>
                            <th>Entrada</th>
                            <th>Salida</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td></td><td></td><td></td></tr>
                        <tr><td></td><td></td><td></td></tr>
                        <tr><td></td><td></td><td></td></tr>
                        <tr><td></td><td></td><td></td></tr>
                        <tr><td></td><td></td><td></td></tr>
                        <tr><td></td><td></td><td></td></tr>
                        <tr><td></td><td></td><td></td></tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>
</body>
</html>
