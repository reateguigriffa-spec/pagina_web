    <!DOCTYPE html>
    <html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Iniciar sesión</title>
        <link rel="icon" href="assets/icons/senati.ico" type="image/x-icon">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;1,600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="assets/css/login.css">
    </head>
    <body>
        <main class="login-page">

            <!-- Panel izquierdo: reconocimiento facial -->
            <section class="promo" aria-label="Validación de identidad">
                <div class="promo-text">
                    <p class="promo-lead">Valida tu identidad con la opción</p>
                    <p class="promo-badge">“Reconocimiento Facial”</p>
                </div>

                <figure class="promo-figure">
                    <!-- Pon aquí tu foto de la mano con el celular; si no existe, se ve la ilustración de respaldo -->
                    <img src="assets/images/images 5 (1).png"Mano sosteniendo un celular que escanea un rostro" onerror="this.remove()">
                </figure>

                <img src="assets/images/images_1.png" alt="Logo BCP" class="promo-logo">
            </section>

            <!-- Panel derecho: formulario -->
            <section class="auth" aria-labelledby="login-title">
                <form class="login-form" action="#" method="post" novalidate>
                    <h1 id="login-title" class="login-title">Iniciar sesión</h1>

                    <div class="field">
                        <label for="email">Correo Electrónico:</label>
                        <input type="email" id="email" name="email" placeholder="ejemplo@gmail.com" autocomplete="username" required>
                    </div>

                    <div class="field">
                        <label for="password">contraseña:</label>
                        <input type="password" id="password" name="password" placeholder="Ingresar su contraseña" autocomplete="current-password" required>
                    </div>

                    <button type="submit" class="btn-submit">INGRESAR</button>
                </form>
            </section>

        </main>
    </body>
    </html>
