body::before {
  right: 0;
  bottom: 0;
  width: min(36vw, 680px);
  height: min(64vh, 580px);
}

body::after {
  left: 0;
  top: 0;
  width: min(24vw, 460px);
  height: min(72vh, 600px);
  transform: rotate(180deg);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* =========================================
   2. LAYOUT: dos columnas centradas
   ========================================= */
.marcacion {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(40px, 7vw, 140px);
  width: 100%;
  padding: clamp(24px, 5vh, 72px) clamp(20px, 4vw, 80px);
}

/* =========================================
   3. COLUMNA IZQUIERDA: PERFIL
   ========================================= */
.perfil {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: clamp(14px, 2.6vh, 32px);
  width: clamp(200px, 21vw, 400px);
  text-align: center;
}

.perfil-logo {
  align-self: flex-start;
  height: clamp(30px, 3.6vw, 64px);
  width: auto;
  display: block;
}

.perfil-avatar {
  width: clamp(130px, 14vw, 270px);
  height: auto;
  display: block;
}

.perfil-nombre {
  font-size: clamp(16px, 1.55vw, 30px);
  font-weight: 500;
  line-height: 1.35;
  letter-spacing: .4px;
  text-transform: uppercase;
}

/* =========================================
   4. COLUMNA DERECHA: CÁMARA + CÓDIGO
   ========================================= */
.escaner {
  display: flex;
  flex-direction: column;
  gap: clamp(12px, 2vh, 24px);
  width: clamp(260px, 25vw, 480px);
}

.camara {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  background: #000;
  border-radius: 3px;
  overflow: hidden;
}

.camara-video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transform: scaleX(-1);          /* efecto espejo, como una selfie */
}

/* Esquinas de enfoque */
.esquina {
  position: absolute;
  width: 20%;
  aspect-ratio: 1 / 1;
  border: 0 solid #fff;
  pointer-events: none;
}

.arriba-izq { top: 12%;    left: 12%;  border-top-width: 3px;    border-left-width: 3px; }
.arriba-der { top: 12%;    right: 12%; border-top-width: 3px;    border-right-width: 3px; }
.abajo-izq  { bottom: 12%; left: 12%;  border-bottom-width: 3px; border-left-width: 3px; }
.abajo-der  { bottom: 12%; right: 12%; border-bottom-width: 3px; border-right-width: 3px; }

/* Campo del código de barras */
.codigo {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 clamp(10px, 1vw, 18px);
  height: clamp(36px, 3.4vw, 60px);
  background: #fff;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(20, 40, 79, .12);
  cursor: text;
}

.codigo:focus-within {
  box-shadow: 0 0 0 3px rgba(47, 155, 224, .45);
}

.codigo-icono {
  flex: none;
  height: 55%;
  width: auto;
  fill: #111;
}

.codigo input {
  flex: 1;
  min-width: 0;
  height: 100%;
  font: inherit;
  font-size: clamp(14px, 1.1vw, 20px);
  font-weight: 500;
  letter-spacing: .5px;
  color: var(--azul-texto);
  background: transparent;
  border: 0;
  outline: none;
}

.codigo input::placeholder {
  color: #9aa6b8;
}

/* =========================================
   5. VENTANAS ESTRECHAS: apilar en columna
   ========================================= */
@media (max-width: 640px) {
  .marcacion {
    flex-direction: column;
    gap: 28px;
  }

  .perfil {
    width: min(100%, 320px);
  }

  .perfil-logo {
    align-self: center;
  }

  .perfil-avatar {
    width: 150px;
  }

  .escaner {
    width: min(100%, 360px);
  }
}

</style>
</head>
